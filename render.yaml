services:
  - type: web
    name: reeltogether-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    disk:
      name: movie-data
      mountPath: /data
      sizeGB: 1
    autoDeploy: true
    envVars:
      - key: PROXY_SHARED_SECRET
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_DOCS
        value: "false"
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: ENABLE_STARTUP_SYNC
        value: "true"
      - key: STARTUP_SYNC_ASYNC
        value: "true"
      - key: REDIS_URL
        sync: false
      - key: DATABASE_URL
        value: sqlite:////data/movie_analytics.db
      - key: TMDB_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: OMDB_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: TRUSTED_HOSTS
        sync: false

  - type: web
    name: reeltogether-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: PROXY_SHARED_SECRET
        sync: false
      - key: API_BASE_URL
        sync: false
