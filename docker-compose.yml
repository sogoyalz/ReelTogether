services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-sqlite:////data/movie_analytics.db}
      AUTO_CREATE_TABLES: "false"
      ENABLE_JOB_WORKER: "false"
      ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000","http://localhost:3001"]}'
      TRUSTED_HOSTS: '["backend", "localhost", "127.0.0.1"]'
      REDIS_URL: ""
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:?Set a shared proxy secret in the root .env}
    volumes:
      - movie-data:/data
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  backups:
    build:
      context: ./backend
    command: ["python", "backup_worker.py"]
    environment:
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-sqlite:////data/movie_analytics.db}
      BACKUP_DIRECTORY: /data/backups
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-reeltogether/backups}
      BACKUP_S3_ENCRYPTION: ${BACKUP_S3_ENCRYPTION:-AES256}
      BACKUP_S3_KMS_KEY_ID: ${BACKUP_S3_KMS_KEY_ID:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    volumes:
      - movie-data:/data
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "backup_health.py"]
      interval: 5m
      timeout: 10s
      start_period: 2m
      retries: 2
    restart: unless-stopped

  jobs:
    build:
      context: ./backend
    command: ["python", "job_worker.py"]
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-sqlite:////data/movie_analytics.db}
      ENABLE_PERIODIC_SYNC: ${ENABLE_PERIODIC_SYNC:-false}
      JOB_HEARTBEAT_FILE: /data/operations/worker.json
      REDIS_URL: ""
    volumes:
      - movie-data:/data
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "job_health.py"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  monitor:
    build:
      context: ./backend
    command: ["python", "operations_monitor.py"]
    environment:
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-sqlite:////data/movie_analytics.db}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      MONITOR_BACKEND_URL: http://backend:8000/health/ready
    volumes:
      - movie-data:/data
    depends_on:
      backend:
        condition: service_healthy
      jobs:
        condition: service_healthy
      backups:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      API_BASE_URL: http://backend:8000
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:?Set a shared proxy secret in the root .env}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  movie-data:
