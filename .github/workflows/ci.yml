name: Validate ReelTogether
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:////tmp/reeltogether-ci.db
      ENABLE_STARTUP_SYNC: 'false'
      ENABLE_RATE_LIMIT: 'false'
      REDIS_URL: ''
      TMDB_API_KEY: ''
      OMDB_API_KEY: ''
      YOUTUBE_API_KEY: ''
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
        working-directory: backend
      - run: python -m unittest discover -s tests -v
        working-directory: backend
      - run: python -m alembic upgrade head && python -m alembic check
        working-directory: backend
      - run: python -m pip_audit -r requirements.txt
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run typecheck && npm run build && npm audit
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test
        working-directory: frontend
        env:
          BACKEND_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: frontend/test-results
